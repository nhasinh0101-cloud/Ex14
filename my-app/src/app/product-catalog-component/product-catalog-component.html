<div *ngFor="let cate of datas">

  <table border="1">
    <tr>
      <td>Ma Danh Muc</td>
      <td>Ten Danh Muc</td>
    </tr>

    <tr>
      <td>{{ cate.Cateid }}</td>
      <td>{{ cate.CateName }}</td>
    </tr>

    <tr>
      <td colspan="2">

        <table border="1">
          <tr>
            <td>Ma San Pham</td>
            <td>Ten San Pham</td>
            <td>Gia San Pham</td>
            <td>Picture</td>
          </tr>

          <tr *ngFor="let product of cate.Products">
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.price }}</td>
            <td>
              <img [src]="product.image"
                   [alt]="product.name"
                   width="50">
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</div>
